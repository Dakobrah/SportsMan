[package]
name = "sportsman"
version = "0.1.0"
description = "Local-only football play-by-play tracker"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sportsman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
# `bundled` compiles SQLite from source, so every platform gets the same
# engine and version rather than whatever the host ships.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
