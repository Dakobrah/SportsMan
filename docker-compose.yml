version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: sportsman
      POSTGRES_USER: sportsman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsman -d sportsman"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=sportsman.settings.local_network
      - DB_HOST=db
      - DB_NAME=sportsman
      - DB_USER=sportsman
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  # Backup sidecar: pg_dump daily at 02:00, 7-day retention.
  # Dumps land in ./backups/ (same volume mounted on db service).
  # Restore: docker compose exec db psql -U sportsman sportsman < /backups/<file>.sql
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - ./backups:/backups
    # crond -f runs in foreground; the crontab writes a timestamped dump then prunes files >7 days old.
    entrypoint: >
      sh -c "
        echo '0 2 * * * pg_dump -h db -U sportsman -d sportsman -F p --no-password
          > /backups/sportsman_\$$(date +\\%Y\\%m\\%d_\\%H\\%M\\%S).sql
          && find /backups -name \"sportsman_*.sql\" -mtime +7 -delete' | crontab -
        && crond -f -d 8
      "

volumes:
  postgres_data:
  static_files:
  media_files:
